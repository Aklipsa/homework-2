<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Конструктор посещения события</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Карточка события -->
    <section class="card">
      <h1 id="event-title">Ночь в музее</h1>
      <p class="event-date">15 ноября, 18:30</p>
      <p class="event-place">Музей космонавтики, проспект Мира, 111</p>
      <p class="event-description">
        Вечерняя программа с выставкой и экскурсиями
      </p>

      <button id="show-program" type="button">Показать программу</button>
      <div id="program" class="program" hidden></div>
    </section>

    <!-- Ошибка повреждённых данных -->
    <p id="data-error" class="error" hidden>Ошибка данных.</p>

    <!-- Форма выбора услуг -->
    <form id="service-form" class="form" hidden>
      <label>
        <input type="checkbox" id="guide" />
        Экскурсия с гидом
      </label>
      <label>
        <input type="checkbox" id="audio" />
        Аудиогид
      </label>
      <label>
        <input type="checkbox" id="catalog" />
        Каталог выставки
      </label>

      <button type="submit">Рассчитать</button>
      <p id="choice-error" class="error" hidden></p>
    </form>

    <!-- Итог и JSON-строка отчёта -->
    <div id="result" class="result" hidden></div>
    <pre id="report-json" class="report-json" hidden></pre>

    <script src="app.js"></script>
  </body>
</html>
